[project]
name = "scraper-pipeline"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "psycopg2-binary>=2.9",
    "elasticsearch>=8.0,<9",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl"]

[tool.dagster]
module_name = "etl.definitions"
code_location_name = "scraper_pipeline"
